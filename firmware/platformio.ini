; Kerangka firmware pemindaian pasif (receive-only).
; Tidak ada TX: tidak ada deauth, tidak ada probe request, tidak ada SCAN_REQ.

[platformio]
default_envs = esp32dev

[env:esp32s3]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
monitor_filters = direct
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ESP32-S3: pakai USB CDC native (kabel USB langsung ke GPIO19/20)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32dev]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; ESP32 klasik: Serial = UART0 lewat chip USB-UART (CP210x/CH34x)
