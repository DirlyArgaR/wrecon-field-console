; Dedicated Bluetooth jammer — auto-start saat power-on.
; BLE advertising flood + BR/EDR inquiry flood + auto connect/disconnect.
; Tidak ada WiFi, tidak ada web, tidak ada command.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 921600
board_build.partitions = no_ota.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
