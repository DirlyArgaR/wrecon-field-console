; ESP32 deauth lab controller — NDJSON @ 921600 over CP210x/CH340 UART.
; Transmit only toward BSSIDs in the explicit target list.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@6.9.0
board     = esp32dev
framework = arduino
monitor_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
